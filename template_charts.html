<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Rewind — the full numbers</title>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --page:           #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --good:           #006300;
  --bad:            #d03b3b;

  --series-1: #2a78d6;  /* blue   */
  --series-2: #eb6834;  /* orange */
  --series-3: #1baf7a;  /* aqua   */

  /* ordinal blue ramp, lightest -> darkest (validated for the light surface) */
  --ord-1: #86b6ef;
  --ord-2: #5598e7;
  --ord-3: #2a78d6;
  --ord-4: #1c5cab;
  --ord-5: #104281;

  /* 4-step variant for sleep stages */
  --sleep-deep:  #104281;
  --sleep-rem:   #256abf;
  --sleep-light: #5598e7;
  --sleep-awake: #86b6ef;

  /* sequential heatmap ramp */
  --seq-0: #eceae4;
  --seq-1: #cde2fb;
  --seq-2: #9ec5f4;
  --seq-3: #5598e7;
  --seq-4: #256abf;
  --seq-5: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --good:           #0ca30c;
    --bad:            #e66767;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;

    --ord-1: #9ec5f4;
    --ord-2: #6da7ec;
    --ord-3: #3987e5;
    --ord-4: #256abf;
    --ord-5: #184f95;

    --sleep-deep:  #184f95;
    --sleep-rem:   #2a78d6;
    --sleep-light: #5598e7;
    --sleep-awake: #86b6ef;

    --seq-0: #232322;
    --seq-1: #184f95;
    --seq-2: #256abf;
    --seq-3: #3987e5;
    --seq-4: #6da7ec;
    --seq-5: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:      #1a1a19;
  --page:           #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255,255,255,0.10);
  --good:           #0ca30c;
  --bad:            #e66767;

  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;

  --ord-1: #9ec5f4;
  --ord-2: #6da7ec;
  --ord-3: #3987e5;
  --ord-4: #256abf;
  --ord-5: #184f95;

  --sleep-deep:  #184f95;
  --sleep-rem:   #2a78d6;
  --sleep-light: #5598e7;
  --sleep-awake: #86b6ef;

  --seq-0: #232322;
  --seq-1: #184f95;
  --seq-2: #256abf;
  --seq-3: #3987e5;
  --seq-4: #6da7ec;
  --seq-5: #9ec5f4;
}

/* ---------- page ---------- */
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 24px 64px;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1280px; margin: 0 auto; }

header.top {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
}
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
.theme-toggle {
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-secondary); border-radius: 8px;
  padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer;
}
.theme-toggle:hover { color: var(--text-primary); }

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
}
.card h2 {
  font-size: 14px; font-weight: 600; margin: 0 0 2px;
  letter-spacing: -0.005em;
}
.card .note { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 16px; }

.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.col-12 { grid-column: span 12; }
.col-8  { grid-column: span 8;  }
.col-6  { grid-column: span 6;  }
.col-4  { grid-column: span 4;  }
@media (max-width: 1000px) { .col-8, .col-6, .col-4 { grid-column: span 12; } }

/* ---------- hero ---------- */
.hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.hero .figure { font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
.hero .unit { font-size: 22px; color: var(--text-secondary); font-weight: 500; }
.hero-detail { color: var(--text-secondary); margin-top: 10px; font-size: 13.5px; }
.hero-records {
  display: grid; gap: 16px; margin-top: 22px; padding-top: 18px;
  border-top: 1px solid var(--grid);
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}

/* ---------- stat tiles ---------- */
.tiles { display: grid; gap: 16px; grid-template-columns: repeat(6, 1fr); }
@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 620px)  { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile .label { font-size: 12.5px; color: var(--text-secondary); }
.tile .value {
  font-size: 28px; font-weight: 600; line-height: 1.15;
  margin-top: 6px; letter-spacing: -0.02em;
}
.tile .value .u { font-size: 14px; color: var(--text-secondary); font-weight: 500; margin-left: 3px; }
.tile .delta { font-size: 12.5px; margin-top: 2px; color: var(--text-muted); }
.tile .delta.up   { color: var(--good); }
.tile .delta.down { color: var(--bad); }
.tile svg { display: block; margin-top: 10px; }

/* ---------- legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-secondary); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend i.line { height: 3px; width: 14px; border-radius: 2px; }

/* ---------- svg chart chrome ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--text-muted); }
.chart .tick { font-variant-numeric: tabular-nums; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .crosshair { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
.chart .hit { fill: transparent; }
.chart .endlabel { fill: var(--text-primary); font-weight: 600; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  transition: opacity .09s;
  background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 9px;
  padding: 9px 11px; font-size: 12.5px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(0,0,0,.14);
  max-width: 260px;
}
.tip .t-title { font-weight: 600; margin-bottom: 3px; }
.tip .t-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tip .t-row i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tip .t-row .k { color: var(--text-secondary); }
.tip .t-row .v { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- records ---------- */
.records { display: grid; gap: 14px 24px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.rec .r-label { font-size: 12.5px; color: var(--text-secondary); }
.rec .r-value { font-size: 22px; font-weight: 600; margin-top: 3px; letter-spacing: -0.015em; }
.rec .r-detail { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

/* ---------- table view ---------- */
details.table-view { margin-top: 14px; }
details.table-view summary {
  cursor: pointer; font-size: 12.5px; color: var(--text-secondary);
  list-style: none; display: inline-flex; align-items: center; gap: 5px;
}
details.table-view summary::-webkit-details-marker { display: none; }
details.table-view summary::before { content: "▸"; font-size: 10px; }
details.table-view[open] summary::before { content: "▾"; }
.table-scroll { overflow-x: auto; margin-top: 10px; max-height: 320px; overflow-y: auto; }
table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
th, td { text-align: right; padding: 5px 10px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th {
  position: sticky; top: 0; background: var(--surface-1);
  color: var(--text-secondary); font-weight: 600;
  border-bottom: 1px solid var(--axis);
}
tbody td { border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }

/* ---------- heatmap ---------- */
.heat-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: var(--text-secondary); }
.heat-foot i { width: 11px; height: 11px; border-radius: 3px; display: block; }

/* ---------- top bar ---------- */
header.top .actions { display: flex; gap: 8px; align-items: center; }
.jump {
  border: 1px solid var(--border); background: var(--surface-1);
  color: var(--text-secondary); border-radius: 8px;
  padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer;
  text-decoration: none;
}
.jump:hover { color: var(--text-primary); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>The full numbers</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="actions">
      <a class="jump" href="rewind.html">← Back to Rewind</a>
      <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
    </div>
  </header>

  <div class="grid" id="root"></div>
</div>

<div class="tip" id="tip" role="tooltip" aria-live="polite"></div>

<script>
const DATA = /*__PAYLOAD__*/null;

/* ============================ helpers ============================ */
const $ = (sel, root) => (root || document).querySelector(sel);
const SVG_NS = "http://www.w3.org/2000/svg";
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function el(tag, attrs, parent) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const k in (attrs || {})) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
}
function html(tag, cls, parent, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  if (parent) parent.appendChild(node);
  return node;
}

/* Garmin's five-step "how did it feel" scale, on its 0-100 wire values. */
const FEEL = {0: "Very weak", 25: "Weak", 50: "Normal", 75: "Strong", 100: "Very strong"};

const fmt = {
  int: v => Math.round(v).toLocaleString("en-US"),
  one: v => (Math.round(v * 10) / 10).toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1}),
  hours: v => {
    const h = Math.floor(v), m = Math.round((v - h) * 60);
    return h + "h " + String(m).padStart(2, "0") + "m";
  },
  pace: s => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0"),
  clock: h => String(Math.floor(h)).padStart(2, "0") + ":" +
              String(Math.round((h % 1) * 60)).padStart(2, "0"),
  day: iso => {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-GB",
      {day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
  },
  dayShort: iso => {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-GB",
      {day: "numeric", month: "short", timeZone: "UTC"});
  },
};

/* "Nice" axis ticks on clean round numbers. */
function niceTicks(min, max, count) {
  if (min === max) { min = Math.min(0, min); max = max || 1; }
  const raw = (max - min) / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 1000; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return ticks;
}

/* ---------------------------- tooltip ---------------------------- */
const tip = $("#tip");
function showTip(evt, title, rows) {
  tip.innerHTML = "";
  html("div", "t-title", tip, title);
  for (const r of rows) {
    const row = html("div", "t-row", tip);
    if (r.color) html("i", null, row).style.background = r.color;
    html("span", "k", row, r.k);
    html("span", "v", row, r.v);
  }
  tip.style.opacity = "1";
  moveTip(evt);
}
function moveTip(evt) {
  const pad = 14, box = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + box.width > innerWidth - 8) x = evt.clientX - box.width - pad;
  if (y + box.height > innerHeight - 8) y = evt.clientY - box.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.style.opacity = "0"; }

/* --------------------- responsive chart host --------------------- */
const redrawers = [];
function chartHost(parent, height, draw) {
  const host = html("div", null, parent);
  const run = () => {
    const w = host.clientWidth;
    if (w < 40) return;
    host.innerHTML = "";
    const svg = el("svg", {class: "chart", width: w, height: height,
                           viewBox: "0 0 " + w + " " + height}, host);
    draw(svg, w, height);
  };
  redrawers.push(run);
  requestAnimationFrame(run);
  return host;
}
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => redrawers.forEach(fn => fn()), 120);
});

/* ============================ charts ============================ */

/* Line chart with optional baseline band, crosshair and nearest-point tooltip. */
function lineChart(parent, opts) {
  const M = {t: 12, r: opts.rightPad || 46, b: 24, l: 44};
  chartHost(parent, opts.height || 210, (svg, W, H) => {
    const pts = opts.points;
    if (!pts.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    let lo = Math.min(...pts.map(p => p.value));
    let hi = Math.max(...pts.map(p => p.value));
    if (opts.band) {
      lo = Math.min(lo, ...opts.band.map(b => b.low).filter(v => v != null));
      hi = Math.max(hi, ...opts.band.map(b => b.high).filter(v => v != null));
    }
    const pad = (hi - lo) * 0.12 || 1;
    /* a fixed-scale metric (a 0-100 rating) gets its real domain, so the
       plot isn't squashed into the middle of an invented range */
    const ticks = opts.domain
      ? niceTicks(opts.domain[0], opts.domain[1], 4)
      : niceTicks(lo - pad, hi + pad, 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];

    const X = i => M.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
    const Y = v => M.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

    for (const t of ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t) + 4, "text-anchor": "end"}, svg)
        .textContent = opts.yFormat ? opts.yFormat(t) : fmt.int(t);
    }

    /* balanced-range band sits under the line as a 10% wash */
    if (opts.band) {
      const top = [], bottom = [];
      pts.forEach((p, i) => {
        const b = opts.band[i];
        if (b && b.low != null && b.high != null) {
          top.push(X(i) + "," + Y(b.high));
          bottom.unshift(X(i) + "," + Y(b.low));
        }
      });
      if (top.length) {
        el("polygon", {points: top.concat(bottom).join(" "),
                       fill: css(opts.color), "fill-opacity": 0.10}, svg);
      }
    }

    const d = pts.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.value)).join(" ");
    el("path", {d: d, fill: "none", stroke: css(opts.color), "stroke-width": 2,
                "stroke-linejoin": "round", "stroke-linecap": "round"}, svg);

    /* end dot + direct label, with a 2px surface ring */
    const last = pts[pts.length - 1];
    el("circle", {cx: X(pts.length - 1), cy: Y(last.value), r: 4.5,
                  fill: css(opts.color), stroke: css("--surface-1"), "stroke-width": 2}, svg);
    el("text", {class: "endlabel", x: X(pts.length - 1) + 9, y: Y(last.value) + 4}, svg)
      .textContent = opts.valueFormat ? opts.valueFormat(last.value) : fmt.int(last.value);

    /* x labels: first, middle, last */
    [0, Math.floor(pts.length / 2), pts.length - 1].forEach((i, n) => {
      el("text", {x: X(i), y: H - 6,
                  "text-anchor": n === 0 ? "start" : n === 2 ? "end" : "middle"}, svg)
        .textContent = fmt.dayShort(pts[i].date);
    });

    const cross = el("line", {class: "crosshair", y1: M.t, y2: M.t + ih,
                              x1: 0, x2: 0, opacity: 0}, svg);
    const dot = el("circle", {r: 4.5, fill: css(opts.color),
                              stroke: css("--surface-1"), "stroke-width": 2, opacity: 0}, svg);
    const hit = el("rect", {class: "hit", x: M.l, y: M.t, width: iw, height: ih}, svg);

    hit.addEventListener("mousemove", evt => {
      const rect = svg.getBoundingClientRect();
      const rel = (evt.clientX - rect.left - M.l) / iw;
      const i = Math.max(0, Math.min(pts.length - 1, Math.round(rel * (pts.length - 1))));
      const p = pts[i];
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
      cross.setAttribute("opacity", 1);
      dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(p.value));
      dot.setAttribute("opacity", 1);
      const rows = [{color: css(opts.color), k: opts.seriesName,
                     v: (opts.valueFormat ? opts.valueFormat(p.value) : fmt.int(p.value)) +
                        (opts.unit ? " " + opts.unit : "")}];
      if (opts.extraRows) rows.push(...opts.extraRows(p, i));
      showTip(evt, fmt.day(p.date), rows);
    });
    hit.addEventListener("mouseleave", () => {
      cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); hideTip();
    });
  });
}

/* Column chart, single series, optional goal reference line. */
function columnChart(parent, opts) {
  /* a goal line needs room in the right margin for its label */
  const M = {t: 12, r: opts.goal ? 62 : 12, b: 24, l: 44};
  chartHost(parent, opts.height || 210, (svg, W, H) => {
    const rows = opts.rows;
    if (!rows.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    const maxV = Math.max(...rows.map(r => r.value), opts.goal || 0);
    const ticks = niceTicks(0, maxV * 1.05, 4);
    const yMax = ticks[ticks.length - 1];
    const Y = v => M.t + ih - (v / yMax) * ih;

    const band = iw / rows.length;
    const bw = Math.max(1, Math.min(24, band - 2));   /* 2px surface gap, ≤24px thick */

    for (const t of ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t) + 4, "text-anchor": "end"}, svg)
        .textContent = opts.yFormat ? opts.yFormat(t) : fmt.int(t);
    }

    rows.forEach((r, i) => {
      const x = M.l + i * band + (band - bw) / 2;
      const h = r.value > 0 ? Math.max(1.5, (r.value / yMax) * ih) : 0;
      if (h > 0) {
        const radius = Math.min(4, bw / 2, h);
        /* rounded data-end, square at the baseline */
        el("path", {
          d: "M" + x + " " + (M.t + ih) +
             " V" + (M.t + ih - h + radius) +
             " a" + radius + " " + radius + " 0 0 1 " + radius + " " + (-radius) +
             " h" + (bw - 2 * radius) +
             " a" + radius + " " + radius + " 0 0 1 " + radius + " " + radius +
             " V" + (M.t + ih) + " Z",
          fill: css(opts.color)
        }, svg);
      }
      const hit = el("rect", {class: "hit", x: M.l + i * band, y: M.t,
                              width: band, height: ih}, svg);
      hit.addEventListener("mousemove", evt =>
        showTip(evt, r.title, opts.tipRows(r)));
      hit.addEventListener("mouseleave", hideTip);
    });

    if (opts.goal) {
      el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: Y(opts.goal), y2: Y(opts.goal),
                  stroke: css("--text-muted")}, svg);
      /* label lives in the right margin, clear of every column */
      el("text", {x: M.l + iw + 7, y: Y(opts.goal) + 4, "text-anchor": "start"}, svg)
        .textContent = opts.goalLabel;
    }

    el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih}, svg);

    const stride = Math.max(1, Math.ceil(rows.length / 7));
    rows.forEach((r, i) => {
      if (i % stride) return;
      el("text", {x: M.l + i * band + band / 2, y: H - 6, "text-anchor": "middle"}, svg)
        .textContent = r.label;
    });
  });
}

/* Stacked columns (sleep stages, Body Battery) with 2px surface gaps. */
function stackedChart(parent, opts) {
  const M = {t: 12, r: 12, b: 24, l: 44};
  chartHost(parent, opts.height || 230, (svg, W, H) => {
    const rows = opts.rows, keys = opts.series;
    if (!rows.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    const totals = rows.map(r => keys.reduce((s, k) => s + (r[k.key] || 0), 0));
    const ticks = niceTicks(0, Math.max(...totals) * 1.05, 4);
    const yMax = ticks[ticks.length - 1];
    const Y = v => M.t + ih - (v / yMax) * ih;

    const band = iw / rows.length;
    const bw = Math.max(1, Math.min(24, band - 2));

    for (const t of ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t) + 4, "text-anchor": "end"}, svg)
        .textContent = opts.yFormat ? opts.yFormat(t) : fmt.int(t);
    }

    rows.forEach((r, i) => {
      const x = M.l + i * band + (band - bw) / 2;
      let cursor = 0;
      keys.forEach(k => {
        const v = r[k.key] || 0;
        if (v <= 0) return;
        const yTop = Y(cursor + v), yBot = Y(cursor);
        /* 2px surface gap between touching segments */
        const h = Math.max(1, yBot - yTop - 2);
        el("rect", {x: x, y: yTop, width: bw, height: h, fill: css(k.color)}, svg);
        cursor += v;
      });
      const hit = el("rect", {class: "hit", x: M.l + i * band, y: M.t,
                              width: band, height: ih}, svg);
      hit.addEventListener("mousemove", evt => showTip(evt, opts.title(r),
        keys.map(k => ({color: css(k.color), k: k.name, v: opts.format(r[k.key] || 0)}))
            .concat(opts.extraRows ? opts.extraRows(r) : [])));
      hit.addEventListener("mouseleave", hideTip);
    });

    el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih}, svg);

    const stride = Math.max(1, Math.ceil(rows.length / 7));
    rows.forEach((r, i) => {
      if (i % stride) return;
      el("text", {x: M.l + i * band + band / 2, y: H - 6, "text-anchor": "middle"}, svg)
        .textContent = opts.label(r);
    });
  });
}

/* Grouped columns — two series side by side (Body Battery charge vs drain). */
function groupedChart(parent, opts) {
  const M = {t: 12, r: 12, b: 24, l: 44};
  chartHost(parent, opts.height || 210, (svg, W, H) => {
    const rows = opts.rows, keys = opts.series;
    if (!rows.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    const maxV = Math.max(...rows.flatMap(r => keys.map(k => r[k.key] || 0)));
    const ticks = niceTicks(0, maxV * 1.05, 4);
    const yMax = ticks[ticks.length - 1];
    const Y = v => M.t + ih - (v / yMax) * ih;

    const band = iw / rows.length;
    const bw = Math.max(0.8, Math.min(11, (band - 2) / keys.length - 1));

    for (const t of ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t) + 4, "text-anchor": "end"}, svg)
        .textContent = fmt.int(t);
    }

    rows.forEach((r, i) => {
      const groupW = bw * keys.length + 2 * (keys.length - 1);
      const x0 = M.l + i * band + (band - groupW) / 2;
      keys.forEach((k, j) => {
        const v = r[k.key] || 0;
        if (v <= 0) return;
        const h = Math.max(1, (v / yMax) * ih);
        const x = x0 + j * (bw + 2);
        const radius = Math.min(3, bw / 2, h);
        el("path", {
          d: "M" + x + " " + (M.t + ih) +
             " V" + (M.t + ih - h + radius) +
             " a" + radius + " " + radius + " 0 0 1 " + radius + " " + (-radius) +
             " h" + (bw - 2 * radius) +
             " a" + radius + " " + radius + " 0 0 1 " + radius + " " + radius +
             " V" + (M.t + ih) + " Z",
          fill: css(k.color)
        }, svg);
      });
      const hit = el("rect", {class: "hit", x: M.l + i * band, y: M.t,
                              width: band, height: ih}, svg);
      hit.addEventListener("mousemove", evt => showTip(evt, fmt.day(r.date),
        keys.map(k => ({color: css(k.color), k: k.name, v: fmt.int(r[k.key] || 0)}))));
      hit.addEventListener("mouseleave", hideTip);
    });

    el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih}, svg);

    const stride = Math.max(1, Math.ceil(rows.length / 7));
    rows.forEach((r, i) => {
      if (i % stride) return;
      el("text", {x: M.l + i * band + band / 2, y: H - 6, "text-anchor": "middle"}, svg)
        .textContent = fmt.dayShort(r.date);
    });
  });
}

/* Horizontal bars with value at the tip. */
function hBarChart(parent, opts) {
  const rows = opts.rows;
  const rowH = opts.rowHeight || 30, M = {t: 6, r: 56, b: 6, l: 96};
  chartHost(parent, rows.length * rowH + M.t + M.b, (svg, W, H) => {
    if (!rows.length) return;
    const iw = W - M.l - M.r;
    const maxV = Math.max(...rows.map(r => r.value)) || 1;
    const bh = 16;

    rows.forEach((r, i) => {
      const y = M.t + i * rowH + (rowH - bh) / 2;
      const w = Math.max(2, (r.value / maxV) * iw);
      const radius = Math.min(4, bh / 2, w);
      el("text", {x: M.l - 10, y: y + bh / 2 + 4, "text-anchor": "end",
                  fill: css("--text-secondary")}, svg).textContent = r.label;
      el("path", {
        d: "M" + M.l + " " + y +
           " H" + (M.l + w - radius) +
           " a" + radius + " " + radius + " 0 0 1 " + radius + " " + radius +
           " V" + (y + bh - radius) +
           " a" + radius + " " + radius + " 0 0 1 " + (-radius) + " " + radius +
           " H" + M.l + " Z",
        fill: css(opts.perRowColor ? r.color : opts.color)
      }, svg);
      el("text", {class: "endlabel", x: M.l + w + 9, y: y + bh / 2 + 4}, svg)
        .textContent = opts.valueFormat(r.value);

      const hit = el("rect", {class: "hit", x: 0, y: M.t + i * rowH, width: W, height: rowH}, svg);
      hit.addEventListener("mousemove", evt => showTip(evt, r.label, opts.tipRows(r)));
      hit.addEventListener("mouseleave", hideTip);
    });
  });
}

/* GitHub-style calendar heatmap of daily training minutes. */
function heatmap(parent, days) {
  const gap = 3, M = {t: 18, l: 32};
  const maxV = Math.max(...days.map(d => d.minutes), 1);
  const steps = ["--seq-1", "--seq-2", "--seq-3", "--seq-4", "--seq-5"];
  const bucket = v => {
    if (v <= 0) return "--seq-0";
    return steps[Math.min(steps.length - 1, Math.floor((v / maxV) * steps.length))];
  };

  /* pad to a whole week so columns align on Monday */
  const [fy, fm, fd] = days[0].date.split("-").map(Number);
  const lead = (new Date(Date.UTC(fy, fm - 1, fd)).getUTCDay() + 6) % 7;
  const cols = Math.ceil((days.length + lead) / 7);

  /* sized off the host so the year fills the card instead of ending mid-width */
  const probe = parent.clientWidth || 900;
  const sized = Math.max(8, Math.min(20, Math.floor((probe - M.l - 4) / cols) - gap));

  chartHost(parent, M.t + 7 * (sized + gap), (svg, W, H) => {
    const cell = Math.max(8, Math.min(20, Math.floor((W - M.l - 4) / cols) - gap));
    const pitch = cell + gap;

    ["Mon", "Wed", "Fri"].forEach((name, i) => {
      el("text", {x: 0, y: M.t + (i * 2) * pitch + cell - 2}, svg).textContent = name;
    });

    /* month labels: one per month, skipped when they would collide */
    let lastMonth = "", lastLabelX = -99;
    for (let col = 0; col < cols; col++) {
      const n = col * 7 - lead;
      const d = days[Math.max(0, n)];
      if (!d) continue;
      const month = d.date.slice(0, 7);
      const x = M.l + col * pitch;
      if (month !== lastMonth && x - lastLabelX >= 30 && x + 24 <= W) {
        lastMonth = month;
        lastLabelX = x;
        const [y2, m2] = month.split("-").map(Number);
        el("text", {x: x, y: M.t - 6}, svg).textContent =
          new Date(Date.UTC(y2, m2 - 1, 1)).toLocaleDateString("en-GB",
            {month: "short", timeZone: "UTC"});
      }
    }

    days.forEach((d, n) => {
      const idx = n + lead;
      const x = M.l + Math.floor(idx / 7) * pitch, y = M.t + (idx % 7) * pitch;
      if (x + cell > W) return;
      el("rect", {x: x, y: y, width: cell, height: cell, rx: 3,
                  fill: css(bucket(d.minutes))}, svg)
        .addEventListener("mousemove", evt => showTip(evt, fmt.day(d.date), [
          {color: css(bucket(d.minutes)), k: "Training",
           v: d.minutes ? d.minutes + " min" : "rest day"},
        ].concat(d.kinds.length ? [{k: "Sessions", v: d.kinds.join(", ")}] : [])));
    });
    svg.addEventListener("mouseleave", hideTip);
  });
}

/* Scatter of run pace over time, with a fitted trend line. */
function paceChart(parent, runs) {
  const M = {t: 12, r: 14, b: 24, l: 52};
  chartHost(parent, 230, (svg, W, H) => {
    if (!runs.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    const t0 = Date.parse(runs[0].date), t1 = Date.parse(runs[runs.length - 1].date);
    const span = (t1 - t0) || 1;
    const X = iso => M.l + ((Date.parse(iso) - t0) / span) * iw;

    const paces = runs.map(r => r.pace);
    /* pace ticks land on whole/half minutes -- decimal "nice" numbers read
       as nonsense once formatted as m:ss */
    const lo0 = Math.min(...paces) * 0.98, hi0 = Math.max(...paces) * 1.02;
    const step = [15, 30, 60, 120, 300].find(s => (hi0 - lo0) / s <= 5) || 600;
    const ticks = [];
    for (let v = Math.floor(lo0 / step) * step; v <= hi0 + step / 100; v += step) ticks.push(v);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    /* faster pace = lower number = higher on the chart */
    const Y = v => M.t + ih - ((yMax - v) / (yMax - yMin)) * ih;

    for (const t of ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t) + 4, "text-anchor": "end"}, svg)
        .textContent = fmt.pace(t);
    }

    /* least-squares trend over the scatter */
    const n = runs.length;
    const xs = runs.map(r => (Date.parse(r.date) - t0) / span);
    const meanX = xs.reduce((a, b) => a + b, 0) / n;
    const meanY = paces.reduce((a, b) => a + b, 0) / n;
    let num = 0, den = 0;
    for (let i = 0; i < n; i++) { num += (xs[i] - meanX) * (paces[i] - meanY); den += (xs[i] - meanX) ** 2; }
    const slope = den ? num / den : 0;
    const at = x => meanY + slope * (x - meanX);
    el("line", {x1: M.l, y1: Y(at(0)), x2: M.l + iw, y2: Y(at(1)),
                stroke: css("--text-muted"), "stroke-width": 2,
                "stroke-linecap": "round", opacity: 0.55}, svg);

    const maxKm = Math.max(...runs.map(r => r.km));
    runs.forEach(r => {
      /* radius carries distance, so the dot is never size-only identity */
      const radius = 4 + 4 * Math.sqrt(r.km / maxKm);
      el("circle", {cx: X(r.date), cy: Y(r.pace), r: radius,
                    fill: css("--series-1"), "fill-opacity": 0.85,
                    stroke: css("--surface-1"), "stroke-width": 2}, svg)
        .addEventListener("mousemove", evt => showTip(evt, r.name, [
          {color: css("--series-1"), k: "Pace", v: fmt.pace(r.pace) + " /km"},
          {k: "Distance", v: fmt.one(r.km) + " km"},
          {k: "Avg HR", v: r.hr ? Math.round(r.hr) + " bpm" : "-"},
          {k: "Date", v: fmt.day(r.date)},
        ]));
    });
    svg.addEventListener("mouseleave", hideTip);

    el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih}, svg);
    [runs[0], runs[runs.length - 1]].forEach((r, i) => {
      el("text", {x: i ? M.l + iw : M.l, y: H - 6, "text-anchor": i ? "end" : "start"}, svg)
        .textContent = fmt.dayShort(r.date);
    });
  });
}

/* Scatter of a self-rated score against the clock time the session started.
   One session is one dot; the muted line is a least-squares trend across the
   day. Single series, so identity needs no colour key. */
function dayScatter(parent, opts) {
  const M = {t: 12, r: 14, b: 24, l: opts.labelWidth || 46};
  const rows = opts.rows;
  chartHost(parent, opts.height || 240, (svg, W, H) => {
    if (!rows.length) return;
    const iw = W - M.l - M.r, ih = H - M.t - M.b;

    /* domain brackets the sessions on whole hours -- a fixed 0-24 would spend
       half the width on hours nothing ever happens in */
    const h0 = Math.floor(Math.min(...rows.map(r => r.hour)) - 0.5);
    const h1 = Math.ceil(Math.max(...rows.map(r => r.hour)) + 0.5);
    const X = h => M.l + ((h - h0) / ((h1 - h0) || 1)) * iw;
    /* inset the value range so dots on the top and bottom steps keep clear of
       the frame instead of sitting on the baseline */
    const span = (opts.max - opts.min) || 1;
    const lo = opts.min - span * 0.08, hi = opts.max + span * 0.08;
    const Y = v => M.t + ih - ((v - lo) / (hi - lo)) * ih;

    for (const t of opts.ticks) {
      el("line", {class: "gridline", x1: M.l, x2: M.l + iw, y1: Y(t.value), y2: Y(t.value)}, svg);
      el("text", {class: "tick", x: M.l - 8, y: Y(t.value) + 4, "text-anchor": "end"}, svg)
        .textContent = t.label;
    }

    const n = rows.length;
    const meanX = rows.reduce((s, r) => s + r.hour, 0) / n;
    const meanY = rows.reduce((s, r) => s + r.value, 0) / n;
    let num = 0, den = 0;
    for (const r of rows) { num += (r.hour - meanX) * (r.value - meanY); den += (r.hour - meanX) ** 2; }
    const slope = den ? num / den : 0;
    const at = h => meanY + slope * (h - meanX);
    const clamp = v => Math.max(opts.min, Math.min(opts.max, v));
    /* span the hours actually trained, not the padded axis -- the trend has
       nothing to say about times of day with no sessions in them */
    const first = Math.min(...rows.map(r => r.hour)), last = Math.max(...rows.map(r => r.hour));
    el("line", {x1: X(first), y1: Y(clamp(at(first))), x2: X(last), y2: Y(clamp(at(last))),
                stroke: css("--text-muted"), "stroke-width": 2,
                "stroke-linecap": "round", opacity: 0.55}, svg);

    rows.forEach(r => {
      el("circle", {cx: X(r.hour), cy: Y(r.value), r: 6,
                    fill: css(opts.color), "fill-opacity": 0.8,
                    stroke: css("--surface-1"), "stroke-width": 2}, svg)
        .addEventListener("mousemove", evt => showTip(evt, r.raw.name, opts.tipRows(r.raw)));
    });
    svg.addEventListener("mouseleave", hideTip);

    el("line", {class: "baseline", x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih}, svg);
    /* keep the hour labels to at most seven so they never collide */
    const step = [1, 2, 3, 4, 6].find(s => (h1 - h0) / s <= 7) || 12;
    const inset = 20;  /* half a "00:00" label -- keeps it out of the gutter */
    for (let h = Math.ceil(h0 / step) * step; h <= h1; h += step) {
      if (X(h) < M.l + inset || X(h) > M.l + iw - inset) continue;
      el("text", {x: X(h), y: H - 6, "text-anchor": "middle"}, svg)
        .textContent = fmt.clock(h);
    }
  });
}

/* 12-point sparkline for a stat tile. */
function sparkline(parent, values, color) {
  const pts = values.map((v, i) => ({v, i})).filter(p => p.v != null);
  if (pts.length < 2) return;
  const W = 150, H = 30;
  const svg = el("svg", {class: "chart", width: W, height: H, viewBox: "0 0 " + W + " " + H}, parent);
  const lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const X = i => (i / (values.length - 1)) * (W - 6) + 3;
  const Y = v => H - 4 - ((v - lo) / ((hi - lo) || 1)) * (H - 10);
  el("path", {d: pts.map((p, n) => (n ? "L" : "M") + X(p.i) + " " + Y(p.v)).join(" "),
              fill: "none", stroke: css(color), "stroke-width": 2,
              "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.45}, svg);
  const last = pts[pts.length - 1];
  el("circle", {cx: X(last.i), cy: Y(last.v), r: 3.5, fill: css(color),
                stroke: css("--surface-1"), "stroke-width": 2}, svg);
}

/* ============================ building blocks ============================ */

function card(span, title, note) {
  const node = html("div", "card col-" + span, $("#root"));
  if (title) html("h2", null, node, title);
  if (note) html("p", "note", node, note);
  return node;
}

function legend(parent, items) {
  const box = html("div", "legend", parent);
  for (const it of items) {
    const span = html("span", null, box);
    const swatch = html("i", it.line ? "line" : null, span);
    swatch.style.background = css(it.color);
    html("span", null, span, it.name);
  }
  /* move the legend above the plot it describes */
  parent.insertBefore(box, parent.querySelector("div:not(.legend)"));
  return box;
}

function tableView(parent, columns, rows, summaryText) {
  const det = html("details", "table-view", parent);
  html("summary", null, det, summaryText || "Table view");
  const scroll = html("div", "table-scroll", det);
  const table = html("table", null, scroll);
  const thead = html("thead", null, table);
  const hrow = html("tr", null, thead);
  columns.forEach(c => html("th", null, hrow, c));
  const tbody = html("tbody", null, table);
  rows.forEach(r => {
    const tr = html("tr", null, tbody);
    r.forEach(cellValue => html("td", null, tr, cellValue));
  });
}

/* ============================ render ============================ */

function render() {
  $("#root").innerHTML = "";
  redrawers.length = 0;

  const d = DATA;
  $("#subtitle").textContent =
    fmt.day(d.meta.start) + " – " + fmt.day(d.meta.end) +
    " · " + d.meta.days + " days · built " + d.meta.generated;

  /* ---- hero ---- */
  {
    const c = card(8);
    const hero = html("div", "hero", c);
    html("span", "figure", hero, fmt.one(d.hero.value));
    html("span", "unit", hero, d.hero.unit);
    html("div", "hero-detail", c, d.hero.label + " — " + d.hero.detail);
    const strip = html("div", "hero-records", c);
    d.records.slice(0, 4).forEach(r => {
      const rec = html("div", "rec", strip);
      html("div", "r-label", rec, r.label);
      html("div", "r-value", rec, r.value);
      html("div", "r-detail", rec, r.detail);
    });
  }

  /* ---- HRV status mix as a small companion ---- */
  {
    const c = card(4, "Overnight HRV status", "Nights in each band over the year");
    hBarChart(c, {
      rows: d.hrv_status_mix.map(r => ({label: r.status, value: r.count})),
      color: "--series-1",
      valueFormat: v => fmt.int(v),
      tipRows: r => [{color: css("--series-1"), k: "Nights", v: fmt.int(r.value)}],
    });
  }

  /* ---- stat tiles ---- */
  {
    const host = html("div", "card col-12", $("#root"));
    html("h2", null, host, "Last 30 days");
    html("p", "note", host, "Each value is a 30-day average; the change compares it with the 30 days before. Sparklines trace the full year.");
    const grid = html("div", "tiles", host);
    d.tiles.forEach(t => {
      const tile = html("div", "tile", grid);
      html("div", "label", tile, t.label);
      const value = html("div", "value", tile);
      value.textContent = t.value;
      if (t.unit) html("span", "u", value, t.unit);
      if (t.delta != null && t.delta !== 0) {
        const better = t.up_is_good ? t.delta > 0 : t.delta < 0;
        const sign = t.delta > 0 ? "+" : "−";
        const magnitude = Math.abs(t.delta);
        html("div", "delta " + (better ? "up" : "down"), tile,
          sign + (magnitude >= 100 ? fmt.int(magnitude) : fmt.one(magnitude)) + " vs prior 30 days");
      } else {
        html("div", "delta", tile, "no change vs prior 30 days");
      }
      sparkline(tile, t.spark, "--series-1");
    });
  }

  /* ---- training calendar ---- */
  {
    const c = card(12, "Training calendar",
      "Every day of the last year, shaded by minutes trained.");
    heatmap(c, d.calendar);
    const foot = html("div", "heat-foot", c);
    html("span", null, foot, "Rest");
    ["--seq-0", "--seq-1", "--seq-2", "--seq-3", "--seq-4", "--seq-5"].forEach(step => {
      html("i", null, foot).style.background = css(step);
    });
    html("span", null, foot, "Most minutes");
    const active = d.calendar.filter(x => x.minutes > 0);
    html("span", null, foot,
      " · " + active.length + " active days (" +
      Math.round(100 * active.length / d.calendar.length) + "% of the year)");
  }

  /* ---- weekly volume ---- */
  {
    const c = card(8, "Weekly training volume", "Distance covered each week across all sports.");
    columnChart(c, {
      rows: d.weekly.map(w => ({
        value: w.km, label: w.label, title: "Week of " + fmt.day(w.date), raw: w,
      })),
      color: "--series-1",
      yFormat: v => fmt.int(v),
      tipRows: r => [
        {color: css("--series-1"), k: "Distance", v: fmt.one(r.raw.km) + " km"},
        {k: "Moving time", v: fmt.hours(r.raw.hours)},
        {k: "Sessions", v: fmt.int(r.raw.count)},
      ],
    });
    tableView(c, ["Week", "Distance (km)", "Moving time", "Sessions"],
      d.weekly.slice().reverse().map(w =>
        [fmt.day(w.date), fmt.one(w.km), fmt.hours(w.hours), w.count]));
  }

  /* ---- activity mix ---- */
  {
    const c = card(4, "Where the time goes", "Moving hours by sport.");
    hBarChart(c, {
      rows: d.type_mix.map(t => ({label: t.type, value: t.hours, raw: t})),
      color: "--series-1",
      valueFormat: v => fmt.one(v) + "h",
      tipRows: r => [
        {color: css("--series-1"), k: "Moving time", v: fmt.hours(r.raw.hours)},
        {k: "Sessions", v: fmt.int(r.raw.count)},
      ].concat(r.raw.distance_sport ? [{k: "Distance", v: fmt.one(r.raw.km) + " km"}] : []),
    });
  }

  /* ---- resting HR ---- */
  {
    const c = card(6, "Resting heart rate", "Seven-day rolling average. Lower trends generally mean better recovery.");
    lineChart(c, {
      points: d.resting_hr, color: "--series-1", seriesName: "Resting HR",
      unit: "bpm", valueFormat: v => fmt.one(v),
    });
  }

  /* ---- HRV ---- */
  {
    const c = card(6, "Overnight HRV",
      "Nightly average against your personal balanced range (the shaded band).");
    legend(c, [
      {name: "Overnight average", color: "--series-1", line: true},
      {name: "Balanced range", color: "--series-1"},
    ]);
    lineChart(c, {
      points: d.hrv.map(h => ({date: h.date, value: h.value})),
      band: d.hrv,
      color: "--series-1", seriesName: "HRV", unit: "ms",
      extraRows: (p, i) => {
        const h = d.hrv[i], rows = [];
        if (h.low != null) rows.push({k: "Balanced range", v: h.low + "–" + h.high + " ms"});
        if (h.status) rows.push({k: "Status", v: h.status.toLowerCase()});
        return rows;
      },
    });
  }

  /* ---- sleep stages ---- */
  {
    const recent = d.sleep.slice(-60);
    const c = card(8, "Sleep stages", "Last 60 nights, stacked by stage.");
    const stages = [
      {key: "deep",  name: "Deep",  color: "--sleep-deep"},
      {key: "rem",   name: "REM",   color: "--sleep-rem"},
      {key: "light", name: "Light", color: "--sleep-light"},
      {key: "awake", name: "Awake", color: "--sleep-awake"},
    ];
    legend(c, stages);
    stackedChart(c, {
      rows: recent, series: stages,
      yFormat: v => fmt.int(v) + "h",
      format: v => fmt.hours(v),
      title: r => fmt.day(r.date),
      label: r => fmt.dayShort(r.date),
      extraRows: r => [
        {k: "Total asleep", v: fmt.hours(r.total)},
        {k: "Sleep score", v: r.score != null ? String(r.score) : "-"},
      ],
    });
    tableView(c, ["Night", "Total", "Deep", "REM", "Light", "Awake", "Score"],
      d.sleep.slice().reverse().map(s => [
        fmt.day(s.date), fmt.hours(s.total), fmt.hours(s.deep), fmt.hours(s.rem),
        fmt.hours(s.light), fmt.hours(s.awake), s.score != null ? s.score : "-",
      ]));
  }

  /* ---- sleep score ---- */
  {
    const scored = d.sleep.filter(s => s.score != null).map(s => ({date: s.date, value: s.score}));
    const c = card(4, "Sleep score", "Garmin's nightly 0–100 rating.");
    lineChart(c, {points: scored, color: "--series-1", seriesName: "Sleep score",
                  height: 300, domain: [0, 100]});
  }

  /* ---- body battery ---- */
  {
    const c = card(8, "Body Battery, charge vs drain",
      "Last 60 days — how much you recovered each day against how much you spent.");
    const series = [
      {key: "charged", name: "Charged", color: "--series-1"},
      {key: "drained", name: "Drained", color: "--series-2"},
    ];
    legend(c, series);
    groupedChart(c, {rows: d.battery.slice(-60), series: series, height: 240});
    tableView(c, ["Day", "Charged", "Drained", "Net"],
      d.battery.slice().reverse().map(b =>
        [fmt.day(b.date), b.charged, b.drained,
         (b.charged - b.drained > 0 ? "+" : "") + (b.charged - b.drained)]));
  }

  /* ---- HR zones ---- */
  {
    const c = card(4, "Time in heart-rate zones", "Across every recorded session this year.");
    const colors = ["--ord-1", "--ord-2", "--ord-3", "--ord-4", "--ord-5"];
    const rows = d.hr_zones.map((z, i) =>
      ({label: z.zone, value: z.hours, color: colors[i], raw: z}));
    hBarChart(c, {
      rows: rows,
      perRowColor: true,
      rowHeight: 46,
      valueFormat: v => fmt.one(v) + "h",
      tipRows: r => [
        {color: css(r.color), k: "Time", v: fmt.hours(r.raw.hours)},
        {k: "Share of total", v: r.raw.share + "%"},
      ],
    });
    tableView(c, ["Zone", "Hours", "Share"],
      d.hr_zones.map(z => [z.zone, fmt.one(z.hours), z.share + "%"]));
  }

  /* ---- steps ---- */
  {
    const recent = d.steps.slice(-90);
    const goal = Math.round(recent.reduce((s, r) => s + (r.goal || 0), 0) /
                            (recent.filter(r => r.goal).length || 1));
    const c = card(8, "Daily steps", "Last 90 days against your average step goal.");
    columnChart(c, {
      rows: recent.map(r => ({
        value: r.value, label: fmt.dayShort(r.date), title: fmt.day(r.date), raw: r,
      })),
      color: "--series-1",
      goal: goal, goalLabel: "goal " + fmt.int(goal),
      yFormat: v => v >= 1000 ? Math.round(v / 1000) + "k" : fmt.int(v),
      tipRows: r => [
        {color: css("--series-1"), k: "Steps", v: fmt.int(r.raw.value)},
        {k: "Goal", v: r.raw.goal ? fmt.int(r.raw.goal) : "-"},
      ],
    });
  }

  /* ---- pace ---- */
  {
    const c = card(4, "Running pace", "Each run of 2 km or more; dot size is distance. Lower is faster.");
    paceChart(c, d.pace);
    tableView(c, ["Date", "Run", "Distance (km)", "Pace", "Avg HR"],
      d.pace.slice().reverse().map(r =>
        [fmt.day(r.date), r.name, fmt.one(r.km), fmt.pace(r.pace) + " /km",
         r.hr ? Math.round(r.hr) : "-"]));
  }

  /* ---- self-rated effort and feel, by time of day ---- */
  {
    const effort = (d.effort || []);
    const rated = effort.filter(e => e.rpe != null);
    const felt = effort.filter(e => e.feel != null);
    const covered = n => " " + n + " of " + d.effort_sessions + " sessions carry one.";
    const when = r => [
      {k: "Started", v: r.clock + " · " + fmt.day(r.date)},
      {k: "Session", v: r.type + " · " + r.minutes + " min"},
    ];

    if (rated.length) {
      const c = card(6, "Perceived effort by time of day",
        "Each session's own 1-10 rating, at the clock time it started; the grey " +
        "line is the trend across the day." + covered(rated.length));
      dayScatter(c, {
        rows: rated.map(e => ({hour: e.hour, value: e.rpe, raw: e})),
        min: 1, max: 10, color: "--series-1",
        ticks: [2, 4, 6, 8, 10].map(v => ({value: v, label: String(v)})),
        labelWidth: 30,
        tipRows: r => [{color: css("--series-1"), k: "Effort", v: r.rpe + " / 10"}].concat(when(r)),
      });
      tableView(c, ["Date", "Start", "Session", "Effort"],
        rated.slice().reverse().map(r =>
          [fmt.day(r.date), r.clock, r.name, r.rpe + " / 10"]));
    }

    if (felt.length) {
      const scale = [0, 25, 50, 75, 100];
      const c = card(6, "How you felt, by time of day",
        "The five-step answer to \"how did that feel?\", at the clock time the " +
        "session started; the grey line is the trend." + covered(felt.length));
      dayScatter(c, {
        rows: felt.map(e => ({hour: e.hour, value: e.feel, raw: e})),
        min: 0, max: 100, color: "--series-2",
        ticks: scale.map(v => ({value: v, label: FEEL[v]})),
        labelWidth: 78,
        tipRows: r => [{color: css("--series-2"), k: "Felt", v: r.feel_label}].concat(when(r)),
      });
      tableView(c, ["Date", "Start", "Session", "Felt"],
        felt.slice().reverse().map(r => [fmt.day(r.date), r.clock, r.name, r.feel_label]));
    }
  }

  /* ---- records ---- */
  {
    const rest = d.records.slice(4);
    if (rest.length) {
      const c = card(12, "More personal bests", "Across the last 12 months.");
      const grid = html("div", "records", c);
      rest.forEach(r => {
        const rec = html("div", "rec", grid);
        html("div", "r-label", rec, r.label);
        html("div", "r-value", rec, r.value);
        html("div", "r-detail", rec, r.detail);
      });
    }
  }
}

/* ---------------------------- theme ---------------------------- */
const toggle = $("#themeToggle");
function currentlyDark() {
  const stamped = document.documentElement.getAttribute("data-theme");
  if (stamped) return stamped === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function syncToggleLabel() {
  toggle.textContent = currentlyDark() ? "Light mode" : "Dark mode";
}
toggle.addEventListener("click", () => {
  document.documentElement.setAttribute("data-theme", currentlyDark() ? "light" : "dark");
  syncToggleLabel();
  render();            /* colors are read from CSS at draw time */
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (!document.documentElement.getAttribute("data-theme")) { syncToggleLabel(); render(); }
});

syncToggleLabel();
render();
</script>
</body>
</html>
